<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | Maria Luiza Mol</title>
    <style>
        :root { --primary: #ff00ff; --dark: #1a1a2e; --bg: #0f0f1a; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; 
            margin: 0; padding: 20px; display: flex; justify-content: center; 
        }
        .container { max-width: 600px; width: 100%; }

        /* Cabeçalho de Impacto */
        .hero { text-align: center; padding: 40px 0; }
        .shape-3d {
            width: 120px; height: 120px; margin: 0 auto 20px;
            background: linear-gradient(45deg, var(--primary), #764ba2);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: morphing 10s infinite alternate;
        }

        /* Cards com efeito Neon */
        .card { 
            background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 20px;
            margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s; backdrop-filter: blur(10px);
        }
        /* O segredo: o efeito rosa agora é permanente nas bordas ou visível no toque */
        .card:hover, .card:active { 
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.02);
        }

        h1 { font-size: 2em; margin: 0; color: #fff; }
        h2 { color: var(--primary); font-size: 1.1em; text-transform: uppercase; margin-bottom: 15px; }
        .links a { 
            color: #fff; text-decoration: none; padding: 10px 20px; 
            border: 1px solid var(--primary); border-radius: 50px; margin: 5px; display: inline-block;
        }
        
        @keyframes morphing {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            100% { border-radius: 60% 40% 30% 70% / 70% 30% 40% 60%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="shape-3d"></div>
        <h1>Maria Luiza Mol</h1>
        <p>Dev Backend & Analista de Sistemas</p>
        <div class="links">
            <a href="https://www.linkedin.com/in/maria-luiza-ads">LinkedIn</a>
            <a href="https://github.com/luizamoll">GitHub</a>
        </div>
    </div>

    <div class="card">
        <h2>Resumo</h2>
        <p>Transição estratégica para a tecnologia. Unindo visão de negócio e desenvolvimento.</p>
    </div>

    <div class="card">
        <h2>Tecnologias</h2>
        <p>Java • C • SQL • Git • Linux</p>
    </div>

    <div class="card">
        <h2>Formação</h2>
        <p>ADS | Newton Paiva (2028)</p>
    </div>
</div>
</body>
</html>
